CONFIG_PICOLIBC=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=40072
# Stream serialization uses input and encrypted-output buffers on the stack.
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_LIBHARU=y
CONFIG_LIBHARU_FONT_HELVETICA=y
CONFIG_LIBHARU_ENCRYPTION=y

# This document only needs Helvetica and password encryption.
CONFIG_LIBHARU_FONT_COURIER=n
CONFIG_LIBHARU_FONT_TIMES=n
CONFIG_LIBHARU_FONT_SYMBOL=n
CONFIG_LIBHARU_FONT_ZAPF_DINGBATS=n
CONFIG_LIBHARU_TRUETYPE=n
CONFIG_LIBHARU_PDFA=n

CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
