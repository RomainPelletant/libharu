CONFIG_ZTEST=y
CONFIG_PICOLIBC=y
# Composite encoders allocate two 256 x 256 16-bit maps.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=524288
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_TEST_EXTRA_STACK_SIZE=16384
CONFIG_LIBHARU=y
# Heap statistics for the leak checks.
CONFIG_SYS_HEAP_RUNTIME_STATS=y
